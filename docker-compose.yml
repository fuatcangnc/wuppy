services:
  wuppy:
    build: .
    ports:
      - "4321:4321"
    environment:
      # Generate with: openssl rand -base64 32
      WUPPY_SECRET: ${WUPPY_SECRET:?set WUPPY_SECRET}
      WUPPY_URL: ${WUPPY_URL:-http://localhost:4321}
    volumes:
      - content:/app/templates/starter/content
      - uploads:/app/templates/starter/public/uploads
      - history:/app/templates/starter/.git
      - state:/app/templates/starter/.wuppy
    restart: unless-stopped

volumes:
  content:
  uploads:
  history:
  state:
